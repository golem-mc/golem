[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
gotestsum = "1.13.0"

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks."examples:build"]
description = "Build the example plugin, its server and its test (examples/ are modules of their own)"
dir = "examples/plugins/hello"
run = "go build -o /dev/null ./... && go vet ./..."

[tasks."pgo:record"]
description = "Record and merge generation and mob-tick CPU profiles into default.pgo"
run = "tools/pgo.sh"

[tasks.test]
description = "Run all tests, rerunning the ones that fail"
run = "tools/test.sh"

[tasks."test:changed"]
description = "Repeat the tests a branch adds or changes, to catch a flaky one before it merges"
run = "tools/test-changed.sh"

[tasks.lint]
description = "Run golangci-lint"
# Wait for golangci-lint's machine-wide lock when other worktrees are checking.
run = "golangci-lint run --allow-serial-runners ./..."

[tasks.fmt]
description = "Format all Go files with gofmt"
run = "gofmt -l -w ."

[tasks."fmt:check"]
description = "Fail if any Go file is not gofmt-formatted"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "not gofmt-formatted (run 'mise run fmt'):" >&2
  echo "$unformatted" >&2
  exit 1
fi
'''

[tasks.tidy]
description = "Tidy go.mod and go.sum, and the example plugin's (a module of its own that builds against this one)"
run = ["go mod tidy", "cd examples/plugins/hello && go mod tidy"]

[tasks."tidy:check"]
description = "Fail if go.mod or go.sum, or the example plugin's, is not tidy"
run = ["go mod tidy -diff", "cd examples/plugins/hello && go mod tidy -diff"]

[tasks.fix]
description = "Apply go fix's modernizations"
run = "go fix ./..."

[tasks."fix:check"]
description = "Fail if go fix would change anything"
# Overlapping fixes can fail with no diff; run each fixer alone to resolve it.
run = "go fix -diff ./..."

[tasks.check]
description = "Everything a PR must pass: build, test, lint, format, fix and tidy checks"
depends = ["build", "test", "lint", "fmt:check", "fix:check", "tidy:check"]

[tasks.release]
description = "Build the release binaries with GoReleaser and attach them to the tagged release (the release workflow runs it)"
tools = { goreleaser = "2.20.0" }
run = "goreleaser release --clean"

[tasks."release:snapshot"]
description = "Build every release binary into dist/ locally, without publishing or signing"
tools = { goreleaser = "2.20.0" }
run = "goreleaser release --snapshot --clean --skip=publish,sign"

[tasks.dev]
description = "Run the server from source with go run"
run = "go run ."

[tasks.probe]
description = "Probe a server and transcribe what it sends (see tools/README.md)"
run = 'go run ./tools/probe {{arg(name="addr", default="127.0.0.1:25565")}}'

[tasks."reference:setup"]
description = "Download the vanilla server, client jar and decompiler of this version (see tools/README.md)"
run = "go run ./tools/reference setup"

[tasks."reference:run"]
description = "Run the downloaded vanilla server as a protocol reference"
tools = { java = "temurin-25" }
run = "go run ./tools/reference run"

[tasks."reference:reports"]
description = "Dump the vanilla registries the client keeps to itself (see tools/README.md)"
tools = { java = "temurin-25" }
run = "go run ./tools/reference reports"

[tasks."reference:dump"]
description = "Start the reference server, probe it and save what it sends as reference-server/registries.json"
tools = { java = "temurin-25" }
run = "go run ./tools/reference dump"

[tasks."worldgen:parity"]
description = "Compare our world generator with vanilla's for a seed and chunk range (see tools/README.md)"
tools = { java = "temurin-25" }
run = "go run ./tools/worldgen-parity"

[tasks."client:setup"]
description = "Download the vanilla client (without sounds) into reference-server/client"
run = "go run ./tools/reference client-setup"

[tasks."client:ctl-build"]
description = "Build the clientctl java agent into reference-server/ (see tools/README.md)"
tools = { java = "temurin-25" }
run = "tools/clientctl/build.sh"

[tasks."client:run"]
description = "Run the vanilla client offline under Xvfb and join ADDRESS (default 127.0.0.1:25565)"
tools = { java = "temurin-25" }
run = 'tools/clientctl/run.sh {{arg(name="address", default="127.0.0.1:25565")}} {{arg(name="username", default="Tester")}}'

[tasks.gen]
description = "Regenerate every generated table from the reference data (see tools/README.md)"
# Requires reference:setup and reference:reports; includes registries if a dump exists.
tools = { java = "temurin-25" }
run = "go run ./tools/gen -all"

[tasks."gen:check"]
description = "Fail if a generated file differs from what the reference data generates (see tools/README.md)"
# Requires the same data as gen, plus reference:dump for registries.
tools = { java = "temurin-25" }
run = "go run ./tools/gen -check -all"

